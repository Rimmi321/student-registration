<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <p>
        <a href="index.html">Home</a> |
        <a href="form.html">Register</a>
    </p>
    <h2>Student Registration Form</h2>
    <form action="thanks.html" method="get">

        <p>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </p>
        <p>
            <label for="regno">Registration No:</label><br>
            <input type="text" id="regno" name="regno" required>
        </p>
        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="03XXXXXXXXX">
        </p>
        <p>
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="16" max="40">
        </p>
        <p>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob">
        </p>
        <p>
            Gender:<br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </p>
        <p>
            <label for="department">Department:</label><br>
            <select id="department" name="department">
                <option value="AI">AI</option>
                <option value="CS">CS</option>
                <option value="SE">SE</option>
                <option value="CT">CT</option>
            </select>
        </p>
        <p>
            Interests:<br>
            <input type="checkbox" id="web" name="interests" value="Web">
            <label for="web">Web</label>
            <input type="checkbox" id="ai" name="interests" value="AI">
            <label for="ai">AI</label>
            <input type="checkbox" id="games" name="interests" value="Games">
            <label for="games">Games</label>
        </p>
        <p>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40"></textarea>
        </p>
        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>
    </form>
</body>
</html>
